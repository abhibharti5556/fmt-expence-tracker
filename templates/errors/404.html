{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block body %}
<div class="auth-shell">
  <div class="auth-card text-center">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='images/final-mile-techies-logo.png') }}" alt="Final Mile Techies logo">
    </div>
    <div class="success-check" style="background: var(--color-info-soft); color: var(--color-info);">
      <i class="ph ph-map-trifold"></i>
    </div>
    <h1 class="h4">Page Not Found</h1>
    <p class="text-muted-fmt">The page you're looking for doesn't exist or may have been moved.</p>
    <a href="{{ url_for('auth.index') }}" class="btn-fmt btn-fmt-primary btn-fmt-block mt-3">
      <i class="ph ph-house"></i> Back to Home
    </a>
  </div>
</div>
{% endblock %}
