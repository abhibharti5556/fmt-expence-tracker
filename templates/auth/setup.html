{% extends "base.html" %}
{% block title %}Initial Setup{% endblock %}
{% block body %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='images/final-mile-techies-logo.png') }}" alt="Final Mile Techies logo">
      <h1>Welcome</h1>
      <p>Create the first Super Admin account to get started.</p>
    </div>

    <div class="inline-alert info">
      <i class="ph ph-info"></i>
      <div>This setup screen only appears once. It disappears permanently after this account is created.</div>
    </div>

    <form method="post" data-lock-submit novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group-fmt">
        <label class="form-label-fmt" for="name">Full Name<span class="required">*</span></label>
        <input type="text" class="form-control-fmt" id="name" name="name" required autofocus
               value="{{ form.name if form else '' }}">
      </div>

      <div class="form-group-fmt">
        <label class="form-label-fmt" for="email">Email<span class="required">*</span></label>
        <input type="email" class="form-control-fmt" id="email" name="email" autocomplete="username" required
               value="{{ form.email if form else '' }}">
      </div>

      <div class="form-group-fmt">
        <label class="form-label-fmt" for="password">Password<span class="required">*</span></label>
        <div class="password-field">
          <input type="password" class="form-control-fmt" id="password" name="password" autocomplete="new-password" minlength="8" required>
          <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">
            <i class="ph ph-eye"></i>
          </button>
        </div>
        <p class="form-hint">Minimum 8 characters.</p>
      </div>

      <div class="form-group-fmt">
        <label class="form-label-fmt" for="confirm_password">Confirm Password<span class="required">*</span></label>
        <input type="password" class="form-control-fmt" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>
      </div>

      <button type="submit" class="btn-fmt btn-fmt-primary btn-fmt-block btn-fmt-lg">
        <span class="btn-spinner"></span>
        <span class="btn-label"><i class="ph ph-shield-check"></i> Create Super Admin</span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
