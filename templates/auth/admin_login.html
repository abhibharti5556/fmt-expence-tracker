{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block body %}
<div class="auth-shell">
  <div class="auth-card">
    <a href="{{ url_for('auth.login_select') }}" class="auth-back-link"><i class="ph ph-arrow-left"></i> Back</a>

    <div class="auth-logo">
      <img src="{{ url_for('static', filename='images/final-mile-techies-logo.png') }}" alt="Final Mile Techies logo">
      <h1>Admin Login</h1>
      <p>Final Mile Techies — Expense Management</p>
    </div>

    <form method="post" data-lock-submit novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

      <div class="form-group-fmt">
        <label class="form-label-fmt" for="email">Email<span class="required">*</span></label>
        <input type="email" class="form-control-fmt" id="email" name="email" autocomplete="username" required autofocus>
      </div>

      <div class="form-group-fmt">
        <label class="form-label-fmt" for="password">Password<span class="required">*</span></label>
        <div class="password-field">
          <input type="password" class="form-control-fmt" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">
            <i class="ph ph-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-fmt btn-fmt-primary btn-fmt-block btn-fmt-lg">
        <span class="btn-spinner"></span>
        <span class="btn-label"><i class="ph ph-sign-in"></i> Login</span>
      </button>
    </form>
  </div>
</div>
{% endblock %}
